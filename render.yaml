services:
  - type: web
    name: snapshop-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SNAPSHOP_MODEL
        value: claude-haiku-4-5-20251001
      - key: DATABASE_URL
        sync: false
      - key: MOCK_MODE
        value: "false"
